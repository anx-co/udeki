<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notas Udeki</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>
  :root{
    --fondo:#eaf1fb; --texto:#f2f6ff; --urgente:#ff5a52;
    --suave:cubic-bezier(.22,1,.36,1);
  }
  html,body{margin:0;height:100%;background:var(--fondo);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--fondo:#0a1020}}

  #marco{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}

  #aviso{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:9px 14px;background:#f2a900;color:#2b1d00;
    font:600 13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
  #aviso[hidden]{display:none!important}

  /* ---- pila de hitos: arriba a la derecha ---- */
  #hitos{position:fixed;top:16px;right:16px;z-index:30;display:none;flex-direction:column;
    align-items:flex-end;gap:7px;pointer-events:none;transition:opacity .5s ease}
  #hitos.on{display:flex}
  #hitos.fuera{opacity:0}
  #hitosTitulo{margin:0 2px 1px;font:700 10px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    letter-spacing:.14em;text-transform:uppercase;color:#8ea3c4}

  .hito{padding:7px 11px;border-radius:10px;background:linear-gradient(160deg,#16263f,#0d1727);
    color:#e8f0ff;border:1px solid #ffffff24;border-left:3px solid var(--tono,#4f8cff);
    font:700 12px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.03em;
    box-shadow:0 12px 26px -12px #000b;animation:entrarHito .5s var(--suave) both}
  .hito-a{--tono:#4f8cff}
  .hito-b{--tono:#8b5cf6}
  .hito-c{--tono:#f2a900}
  .hito-d{--tono:#ff5a52}
  @keyframes entrarHito{
    from{opacity:0;transform:translate(26px,8px) scale(.86);filter:blur(10px)}
    to{opacity:1;transform:none;filter:blur(0)}
  }

  /* ---- aviso flotante del contador: sale del fondo, al centro ---- */
  #panel{position:fixed;z-index:30;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.55);transform-origin:top left;
    opacity:0;filter:blur(18px);pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    padding:24px 28px;border-radius:20px;max-width:min(88vw,440px);text-align:center;
    background:linear-gradient(160deg,#14243f,#0b1424);color:var(--texto);
    border:1px solid #ffffff2b;
    box-shadow:0 30px 70px -18px #000a,0 2px 0 #ffffff1a inset,0 0 0 1px #00000040;
    transition:left .55s var(--suave),top .55s var(--suave),transform .55s var(--suave),
               opacity .5s ease,filter .5s ease,padding .4s ease,border-radius .4s ease}
  #panel.on{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}
  #panel.dock{left:16px;top:16px;transform:translate(0,0) scale(.62);
    padding:10px 13px;border-radius:14px;gap:2px;align-items:flex-start;text-align:left;max-width:none}

  .msg{margin:0;font-size:17px;font-weight:650;line-height:1.35;letter-spacing:.1px}
  .sub{margin:-4px 0 0;font-size:13px;font-weight:500;opacity:.66}
  .cuenta{display:flex;flex-direction:column;align-items:center;gap:2px}
  #panel.dock .cuenta{flex-direction:row;align-items:baseline;gap:4px}

  .num{display:inline-block;font-size:60px;line-height:1;font-weight:800;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;transition:font-size .4s var(--suave),color .3s ease}
  #panel.dock .num{font-size:34px}
  .lbl{font-size:12px;font-weight:600;opacity:.6;text-transform:uppercase;letter-spacing:.09em}
  #panel.dock .lbl{display:none}

  #panel.urgente{border-color:#ff5a5266;box-shadow:0 30px 70px -18px #000a,0 0 44px -8px #ff5a5280}
  #panel.urgente .num{color:var(--urgente);animation:latido .6s ease-in-out infinite}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

  @media (prefers-reduced-motion:reduce){
    #panel,#hitos{transition-duration:.01s}
    #panel.on{filter:none}
    #panel.urgente .num,.hito{animation:none}
  }
  @media print{#marco{position:static;width:100%;height:100vh}#aviso,#panel,#hitos{display:none}}
</style>
</head>
<body>
<iframe id="marco" src="index1.html" title="Notas Udeki"></iframe>
<div id="aviso" hidden></div>

<div id="hitos">
  <p id="hitosTitulo" hidden>Tiempo restante</p>
  <div id="hitosLista"></div>
</div>

<div id="panel" role="status" aria-live="polite">
  <p class="msg" id="msg">Esta página se actualizará</p>
  <p class="sub" id="sub">Guarda lo que estés escribiendo</p>
  <div class="cuenta" id="cuenta" hidden>
    <span class="num" id="num">60</span>
    <span class="lbl" id="lbl">Vista previa · último minuto</span>
  </div>
</div>

<noscript><p style="padding:16px;font:15px system-ui,sans-serif">Activa JavaScript o abre directamente <a href="index1.html">index1.html</a>.</p></noscript>

<script>
(function(){
  "use strict";

  /* ================== CONFIGURACIÓN ================== */
  // 00 de noviembre de 2026, 00:00:00 p.m., hora Colombia (UTC-5, sin horario de verano)
  var LIMITE = Date.parse("2026-11-28T12:00:00-05:00");
  var VIEJO  = "index1.html";
  var NUEVO  = "index2.html";

  var T_MENSAJE = 62; // sale del fondo, al centro
  var T_CUENTA  = 60; // arranca el contador
  var T_ESQUINA = 55; // se va solo a la esquina superior izquierda
  var T_URGENTE = 5;  // vuelve al centro

  var HITOS = [
    { s: 86400, texto: "24 Horas", tono: "a" },
    { s: 43200, texto: "12 Horas", tono: "b" },
    { s: 3600,  texto: "1 Hora",   tono: "c" },
    { s: 60,    texto: "1 Minuto", tono: "d" }
  ];
  /* ================================================== */

  var marco  = document.getElementById("marco");
  var panel  = document.getElementById("panel");
  var msg    = document.getElementById("msg");
  var sub    = document.getElementById("sub");
  var cuenta = document.getElementById("cuenta");
  var num    = document.getElementById("num");
  var lbl    = document.getElementById("lbl");
  var aviso  = document.getElementById("aviso");
  var hitos  = document.getElementById("hitos");
  var titulo = document.getElementById("hitosTitulo");
  var lista  = document.getElementById("hitosLista");

  var params = new URLSearchParams(location.search);
  var forzar = params.get("v");
  var demo   = params.get("demo");
  var DEMO_INI = (demo === "2") ? 86410 : 62;
  var DEMO_VEL = (demo === "2") ? 3600  : 4;   // demo=1: 4x · demo=2: toda la escala en ~24 s

  var terminado = false;
  var ultimoEstado = null;
  var inicioDemo = null;
  var puestos = HITOS.map(function(){ return false; });

  function poner(src){
    if (marco.getAttribute("src") !== src) marco.setAttribute("src", src);
  }

  function verViejo(motivo){
    poner(VIEJO);
    if (motivo){ aviso.textContent = motivo; aviso.hidden = false; }
    else { aviso.hidden = true; aviso.textContent = ""; }
  }

  function verNuevo(){
    aviso.hidden = true;
    poner(NUEVO);                       // se pone ya, sin esperar la comprobación
    try {
      fetch(NUEVO, { method:"HEAD", cache:"no-store" }).then(function(r){
        if (!r.ok){
          verViejo("Todavía no existe " + NUEVO + " (respuesta " + r.status + "). Se sigue mostrando " + VIEJO + ".");
        }
      }).catch(function(){ /* en file:// el fetch falla: se deja NUEVO puesto */ });
    } catch (e) { /* ídem */ }
  }

  function restante(){
    if (demo){
      if (inicioDemo === null) inicioDemo = Date.now();
      return Math.max(0, DEMO_INI - (Date.now() - inicioDemo) / 1000 * DEMO_VEL);
    }
    return Math.max(0, (LIMITE - Date.now()) / 1000);
  }

  // hitos: se colocan una sola vez, en orden, sin borrar los anteriores
  function pintarHitos(s){
    for (var i = 0; i < HITOS.length; i++){
      if (puestos[i] || s > HITOS[i].s) continue;
      puestos[i] = true;

      var chip = document.createElement("div");
      chip.className = "hito hito-" + HITOS[i].tono;
      chip.textContent = HITOS[i].texto;
      lista.appendChild(chip);

      hitos.classList.add("on");
      if (i === 0) titulo.hidden = false;
    }
  }

  function clasificar(s){
    if (s <= 0)         return "fin";
    if (s <= T_URGENTE) return "urgente";
    if (s <= T_ESQUINA) return "esquina";
    if (s <= T_CUENTA)  return "cuenta";
    if (s <= T_MENSAJE) return "mensaje";
    return "oculto";
  }

  // solo cuando cambia la fase: clases, visibilidad, textos
  function aplicarEstado(estado){
    if (estado === "fin"){
      num.textContent = "0";
      terminado = true;
      verNuevo();
      hitos.classList.add("fuera");
      setTimeout(function(){
        panel.className = "";
        hitos.classList.remove("on");
      }, 700);
      return;
    }

    if (estado === "oculto"){
      panel.className = "";
      return;
    }

    var enEsquina = (estado === "esquina");
    panel.className = "on" + (enEsquina ? " dock" : "") + (estado === "urgente" ? " urgente" : "");

    cuenta.hidden = (estado === "mensaje");
    msg.hidden = enEsquina;
    sub.hidden = (estado === "esquina" || estado === "urgente");
    lbl.textContent = (estado === "urgente") ? "Actualizando" : "Vista previa · último minuto";
  }

  // en cada tick: se recalcula fase, se bajan los hitos y, sobre todo, baja el número
  function actualizar(){
    if (terminado) return;

    var s = restante();
    pintarHitos(s);

    var estado = clasificar(s);

    if (estado !== ultimoEstado){
      ultimoEstado = estado;
      aplicarEstado(estado);
    }

    if (estado === "fin" || estado === "oculto" || estado === "mensaje") return;

    var n = String(Math.min(T_CUENTA, Math.max(1, Math.ceil(s))));
    if (num.textContent !== n) num.textContent = n;
  }

  if (forzar === "1"){
    verViejo("Vista forzada: " + VIEJO);
  } else if (forzar === "2"){
    verNuevo();
  } else {
    poner(VIEJO);
    if (demo){
      var marca = document.createElement("p");
      marca.style.cssText = "position:fixed;right:16px;bottom:12px;z-index:31;margin:0;padding:6px 10px;border-radius:8px;background:#0009;color:#fff;font:600 11px/1 system-ui,sans-serif";
      marca.textContent = "DEMO " + demo;
      document.body.appendChild(marca);
    }
    actualizar();
    setInterval(actualizar, 200);
  }

  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && forzar !== "1" && forzar !== "2") actualizar();
  });
})();
</script>
</body>
</html>
